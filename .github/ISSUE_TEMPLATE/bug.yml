name: 버그
description: 동작 오류 신고 (자료 노출·취약점은 이 양식이 아니라 비공개 신고)
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        자료 노출이나 보안 취약점은 이 양식을 쓰지 말고 저장소 루트의 SECURITY.md 에 적힌 비공개 신고(Security advisories)를 이용한다.
  - type: checkboxes
    id: no-real-data
    attributes:
      label: 개인정보 확인
      options:
        - label: 실제 아이 자료·이름·스크린샷을 넣지 않았다.
          required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차 (fixtures 기준)
      description: 합성 자료(`테스트아이` 등)로 재현되는 절차만 적는다.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 기기·OS·브라우저와 버전, 화면 폭, 커밋 해시 등 (개인 식별 정보 제외)
    validations:
      required: true
