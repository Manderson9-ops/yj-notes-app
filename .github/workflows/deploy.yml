name: Deploy

# CI 가 main 의 같은 커밋에서 성공한 뒤에만 배포한다. (docs/09 §3)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # workflow_run 은 CI 성공일 때만. 수동 실행(workflow_dispatch)은 main 브랜치에서 실행한 경우에만(R1-8:
    # 다른 브랜치의 코드가 production 으로 나가는 것을 막는다).
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://yj-notes-app.pages.dev
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: check deploy secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::배포 비밀값 미설정 — 건너뜀"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - name: build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build
      - name: guard (bundle)
        if: steps.gate.outputs.ready == 'true'
        run: npm run guard:bundle
      - name: deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 저장소 루트에서 실행해야 ./functions 가 함께 올라간다.
        run: >
          npx wrangler pages deploy dist
          --project-name yj-notes-app
          --branch main
          --commit-hash "$DEPLOY_SHA"
          --commit-message "deploy ${DEPLOY_SHA::7}"
