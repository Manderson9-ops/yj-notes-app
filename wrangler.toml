name = "yj-notes-app"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# 비밀값(PIN_HASH 등)은 이 파일에 넣지 않는다. 로컬은 .dev.vars, 배포는 Pages 시크릿.

[[d1_databases]]
binding = "DB"
database_name = "yj-notes-db"
# 운영 D1 ID (비밀 아님). docs/09 §1.
database_id = "9129a64a-5e90-450f-9bc5-1b8179d0fdd5"
migrations_dir = "migrations"

# M4: R2 활성화 후 주석 해제 (Cloudflare 대시보드에서 R2 사용 신청 필요, docs/09 §3-1)
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "yj-notes-private"

# preview 환경(R1-8): 미리보기 배포가 운영 D1 에 묶이지 않도록 항상 별도 자원을 명시한다.
# 최상위 [[d1_databases]] 는 production 이다. Pages 의 [env.preview] 는 최상위 바인딩을 물려받지 않으며,
# 아래 database_id 는 일부러 존재하지 않는 자리표시자(전부 0)라서 실제 preview D1 을 만들기 전에는
# 미리보기가 DB 에 닿지 못하고 실패한다(= 운영 자료에 닿는 것보다 안전). 실제 자원은 M2 이후 만든다(docs/09 §1).
# 미리보기에는 fixtures 만 적재한다. 실제 자료를 절대 넣지 않는다.
# preview D1 을 만들면 database_id 를 그 ID 로 바꾼다(운영 ID 를 쓰지 않는다 — tests/security/deploy-config.test.ts 가 검사).
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "yj-notes-db-preview"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# [[env.preview.r2_buckets]]
# binding = "FILES"
# bucket_name = "yj-notes-private-preview"